<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carteles QR · Mis 15 Catalina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--rosa:#C9476E;--tinta:#0E110B;--salvia:#6F7859;--salvia-claro:#9AA385;--crema:#F3F1E9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;color:var(--crema);background:var(--salvia)}

.panel{max-width:640px;margin:0 auto;padding:34px 22px 10px}
.panel h1{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:40px;color:var(--crema);font-weight:500}
.panel p{font-size:13px;line-height:1.7;margin:8px 0 20px;color:var(--crema);opacity:.85}
.campo{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.campo label{font-size:10px;font-weight:500;letter-spacing:.2em;color:var(--crema)}
.campo input{padding:14px;border:1px solid rgba(243,241,233,.5);background:rgba(243,241,233,.10);color:var(--crema);font-family:inherit;font-size:13px;outline:none}
.campo input:focus{border-color:var(--crema)}
.fila{display:flex;gap:10px;flex-wrap:wrap}
.panel button{background:var(--rosa);color:#fff;border:none;padding:15px 26px;font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.2em;cursor:pointer}
.panel button.sec{background:rgba(243,241,233,.10);color:var(--crema);border:1px solid rgba(243,241,233,.5)}

.hoja{
  background:#fff;width:210mm;height:297mm;margin:24px auto;padding:6mm;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:0;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
}
@media(max-width:860px){.hoja{zoom:.52}}
.cartel{
  border:1px dashed #DAD5D2;border-top:2px solid var(--salvia);padding:9mm 7mm 10mm;
  display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:space-between;
  overflow:hidden;break-inside:avoid;
}
.cartel .nombre{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;font-size:34px;color:var(--tinta);line-height:1}
.cartel .xv{font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;letter-spacing:.3em;padding-left:.3em;margin-top:3px;color:var(--tinta)}
.cartel .linea{width:44px;height:1px;background:var(--salvia-claro);margin:9px auto}
.cartel .pedido{font-size:10.5px;font-weight:600;letter-spacing:.16em;line-height:1.9;color:var(--tinta)}
.cartel .qr{padding:7px;border:1px solid rgba(111,120,89,.45)}
.cartel .qr canvas{display:block;width:34mm!important;height:34mm!important}
.cartel .pasos{font-size:8.5px;letter-spacing:.09em;line-height:2;color:#5A6050}
.cartel .pasos b{color:var(--rosa);font-weight:600}
.cartel .nota{font-size:7.5px;letter-spacing:.16em;color:#8A9079}

@media print{
  @page{size:A4;margin:0}
  html,body{
    background:#fff!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  .panel{display:none}
  .hoja{
    margin:0;width:210mm;height:297mm;padding:6mm;zoom:1;
    box-shadow:none;break-inside:avoid;page-break-after:avoid;
  }
  .cartel{border-color:#E4E0DD;border-top-color:var(--salvia)}
}
</style>
</head>
<body>

<div class="panel">
  <h1>Carteles para las mesas</h1>
  <p>El link ya está cargado. Dale a Imprimir: sale una hoja A4 exacta con cuatro carteles, se corta por la línea punteada. Para más mesas, imprimí varias copias (en el diálogo de impresión: Copias). Importante: elegí A4, margen «Ninguno» y tildá «Gráficos de fondo».</p>
  <div class="campo">
    <label for="url">LINK DEL MURO</label>
    <input id="url" type="url" value="https://lucasbarranco-blip.github.io/fotos-cata/" placeholder="https://tuusuario.github.io/xv/">
  </div>
  <div class="fila">
    <button id="b-gen">GENERAR CÓDIGOS</button>
    <button class="sec" id="b-print">IMPRIMIR</button>
  </div>
</div>

<div class="hoja" id="hoja"></div>

<script type="module">
import QRCode from 'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm';

const molde = `
  <div>
    <div class="nombre">Mis 15</div>
    <div class="xv">CATALINA</div>
    <div class="linea"></div>
    <div class="pedido">SACÁ FOTOS<br>Y SUBILAS ACÁ</div>
  </div>
  <div class="qr"><canvas></canvas></div>
  <div>
    <div class="pasos"><b>1</b> ESCANEÁ EL CÓDIGO &nbsp;·&nbsp; <b>2</b> PONÉ TU NOMBRE<br><b>3</b> SUBÍ TODAS LAS QUE QUIERAS</div>
    <div class="linea"></div>
    <div class="nota">AL FINAL DE LA NOCHE LAS VEMOS TODAS JUNTAS</div>
  </div>`;

const hoja = document.getElementById('hoja');
for(let i=0;i<4;i++){
  const c = document.createElement('div');
  c.className = 'cartel';
  c.innerHTML = molde;
  hoja.appendChild(c);
}

async function generar(){
  const url = document.getElementById('url').value.trim();
  if(!url){ document.getElementById('url').focus(); return; }
  for(const cv of hoja.querySelectorAll('canvas')){
    await QRCode.toCanvas(cv, url, {
      width: 520, margin: 1, errorCorrectionLevel: 'H',
      color: { dark:'#2B3222', light:'#FFFFFF' }
    });
  }
}

document.getElementById('b-gen').addEventListener('click', generar);
document.getElementById('b-print').addEventListener('click', ()=> window.print());
document.getElementById('url').addEventListener('keydown', e => { if(e.key==='Enter') generar(); });
generar();
</script>
</body>
</html>
